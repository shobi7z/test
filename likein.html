<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعين انستغرام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-gradient: linear-gradient(45deg, #E1306C, #FF7B4F);
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .title {
            font-size: 2em;
            color: #fff;
            margin: 1rem 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .instagram-icon {
            font-size: 3em;
            color: #fff;
            margin: 1rem 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .input-group {
            margin: 1.5rem 0;
            text-align: right;
        }

        input {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 8px rgba(225, 48, 108, 0.3);
        }

        .price-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 1rem;
            border-radius: 15px;
            margin: 1.5rem 0;
            color: #fff;
        }

        .buy-btn {
            width: 100%;
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            background: var(--main-gradient);
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 1rem 0;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(225, 48, 108, 0.4);
        }

        .payment-methods {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 15px;
            margin-top: 1.5rem;
            color: #fff;
        }

        .payment-methods div {
            margin: 10px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .title {
                font-size: 1.5em;
            }
            
            .instagram-icon {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">لايكات انستغرام</h1>
        <i class="fab fa-instagram instagram-icon"></i>
        
        <div class="input-group">
            <input type="text" placeholder="رابط المنشور">
            <input type="number" placeholder="عدد الايكات" id="followersCount" oninput="calculatePrice()">
        </div>

        <div class="price-box">
            <h3>السعر: <span id="price">0</span>$</h3>
            <small>(كل 10K  لايك ب 5$)</small>
        </div>

        <button class="buy-btn" onclick="window.open('https://t.me/gg13gg13g', '_blank')">شراء الآن</button>

        <div class="payment-methods">
            <h4>طرق الدفع المتاحة:</h4>
            <div>زين كاش</div>
            <div>ماستر كارد</div>
            <div>رصيد اسياسيل</div>
        </div>
    </div>

    <script>
        function calculatePrice() {
            const followers = document.getElementById('followersCount').value;
            const pricePer10000 = 5;
            const totalPrice = (followers / 10000) * pricePer10000;
            document.getElementById('price').textContent = totalPrice.toFixed(2);
        }
    </script>
</body>
</html>
